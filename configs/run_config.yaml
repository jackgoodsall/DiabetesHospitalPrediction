file_information:
  data_dir_path: "data"
  raw_data_path: "raw_data"
  processed_data_path: "processed_data"
  raw_data_file_name:  "diabetic_data.csv"
  processed_data_file_save_name:  "processed_data.csv"
  save_cleaned_data: True

mlflow_information:
  experiment_name: "XGboost Experiments"
  experiment_tag: "Basic model training and basic data engineering"


  save_model: True
  save_dir: "artefacts/models"


data:

  back_end: pandas

  drop_columns:
  - max_glu_serum
  - acetohexamide
  - tolbutamide
  - examide
  - citoglipton
  - glimepiride-pioglitazone
  - metformin-rosiglitazone
  - metformin-pioglitazone
  - encounter_id
  # patient_nbr is intentionally NOT dropped here: it is retained through the
  # split so train/test can be partitioned by patient (preventing the same
  # patient appearing in both sets), then dropped before model training.
  - admission_type_id
  - discharge_disposition_id
  - admission_source_id



  validate: true
  target_column_name: readmitted
  numerical_columns:
    - time_in_hospital
    - num_lab_procedures
    - num_medications
    - number_outpatient
    - number_emergency
    - number_diagnoses
    - number_inpatient
  categorical_columns:
    - race
    - gender
    - age
    - weight
    - change
    - glipizide-metformin
    - glyburide-metformin
    - medical_specialty
    - diag_1
    - diag_2
    - diag_3
    - A1Cresult
    - metformin
    - repaglinide
    - nateglinide
    - chlorpropamide
    - glimepiride
    - glipizide
    - glyburide
    - pioglitazone
    - rosiglitazone
    - acarbose
    - miglitol
    - troglitazone
    - tolazamide
    - insulin
    - diabetesMed

# Train/test split and cross-validation behaviour.
#   group_column: rows sharing this value (a patient) are kept on the same side
#                 of the split, preventing patient-level leakage. Set to null
#                 to fall back to a plain row-level split.
#   stratify:     preserve the target class ratio across train/test and CV folds.
split:
  group_column: patient_nbr
  test_size: 0.2
  stratify: true
  cv_folds: 5

data_engineering:
  numerical_features:
    - time_in_hospital
    - num_lab_procedures
    - num_medications
    - number_outpatient
    - number_emergency
    - number_diagnoses
    - number_inpatient
  categorical_features:
    - race
    - gender
    - age
    - weight
    - change
    - glipizide-metformin
    - glyburide-metformin
    - medical_specialty
    - diag_1
    - diag_2
    - diag_3
    - A1Cresult
    - metformin
    - repaglinide
    - nateglinide
    - chlorpropamide
    - glimepiride
    - glipizide
    - glyburide
    - pioglitazone
    - rosiglitazone
    - acarbose
    - miglitol
    - troglitazone
    - tolazamide
    - insulin
    - diabetesMed
 
  numerical_imputer_strat: "mean"
  categorical_imputer_strat: "most_frequent"
  scaler: "standard"
  remainder: "drop"
  
# Optuna hyperparameter tuning.
#   enabled:    set to true to run a tuning study before the final model refit
#   n_trials:   number of Optuna trials per model
#   metric:     OOF metric to optimise (pr_auc | auc_roc | f1 | brier_score)
#   direction:  maximize or minimize (brier_score should be minimize)
#   cv_folds:   folds used inside the tuning objective (fewer than main CV is fine)
#   timeout:    max seconds per study (null = no limit)
tuning:
  enabled: false
  n_trials: 50
  metric: "pr_auc"
  direction: "maximize"
  cv_folds: 3
  timeout: null

# Evaluation settings.
#   threshold_strategy: how the decision threshold is chosen on the validation set.
#     "f1"         — threshold that maximises F1 (good default for imbalanced data)
#     "recall@0.X" — smallest threshold achieving recall >= X (clinician-friendly)
#     "default"    — fixed 0.5
#   dummy_strategy: DummyClassifier strategy used as a baseline ("stratified" / "most_frequent")
evaluation:
  threshold_strategy: "f1"
  dummy_strategy: "stratified"

# SHAP explainability. Plots (beeswarm/bar/waterfall/dependence) are computed on
# a sample of the test set after each model is trained and logged to MLflow.
explainability:
  enabled: true
  sample_size: 2000   # rows sampled from the test set for SHAP
  max_display: 20     # features shown in summary plots

model:
  model_names:
    - xgboost
    

## Configs for the models - for training uses the model defined above.
logistic_regression:
  C: 1.0
  max_iter: 1000
  solver: lbfgs
  random_state: 42
  n_jobs: -1


random_forest:
  n_estimators: 300
  max_depth: null
  min_samples_split: 2
  random_state: 42
  n_jobs: -1


extra_trees:
  n_estimators: 300
  max_depth: null
  min_samples_split: 2
  random_state: 42
  n_jobs: -1


gradient_boosting:
  n_estimators: 200
  learning_rate: 0.1
  max_depth: 4
  subsample: 0.8
  min_samples_split: 20
  random_state: 42


catboost:
  iterations: 1000
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3
  loss_function: Logloss
  eval_metric: AUC
  random_seed: 42
  verbose: 0


lightgbm:
  n_estimators: 1000
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_samples: 20
  reg_alpha: 0.1
  reg_lambda: 1.0
  random_state: 42
  verbose: -1


xgboost:
  # Basic XGBoost parameters
  objective: "binary:logistic"    
  eval_metric: "logloss"          
  booster: "gbtree"               
  eta: 0.1                        
  max_depth: 6                     
  subsample: 0.8                  
  colsample_bytree: 0.8           
  min_child_weight: 1             
  gamma: 0.1                      
  lambda: 1                      
  alpha: 0.1                        
  n_estimators: 1000              
  random_state: 42                    

